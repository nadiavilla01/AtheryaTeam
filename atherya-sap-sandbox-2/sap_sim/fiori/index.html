<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simulatore S/4HANA · Atherya</title>
<script id="sap-ui-bootstrap"
  src="https://sdk.openui5.org/1.138.0/resources/sap-ui-core.js"
  data-sap-ui-theme="sap_horizon"
  data-sap-ui-libs="sap.m,sap.f,sap.ui.layout"
  data-sap-ui-compat-version="edge"
  data-sap-ui-async="true"
  data-sap-ui-language="it"
  data-sap-ui-resource-roots='{"sim": "./"}'
  data-sap-ui-on-init="module:sim/app"></script>
<style>
  html, body { height: 100%; margin: 0; }
  #root { display: flex; flex-direction: column; height: 100%; }
  #app { flex: 1; min-height: 0; position: relative; }
  .simClock { font-variant-numeric: tabular-nums; }
  .simKpi { margin-right: 1.5rem; }
  .simTiles { gap: 1rem; flex-wrap: wrap; }
  .simGroup { margin: 2rem 2rem 0.75rem; }
</style>
</head>
<body class="sapUiBody">
  <div id="root">
    <div id="shell"></div>
    <div id="strip"></div>
    <div id="clock"></div>
    <div id="app"></div>
  </div>
</body>
</html>
